<dialog id="photo-lightbox">
  <button id="close-lightbox" aria-label="Close">
    <span>back!</span>
<img src="images/black-billiard-ball-with-number-eight-cut-out-png copy.png" alt="back">
  </button>
  <img id="lightbox-img" src="" alt="">
  <video id="lightbox-video" src="" controls playsinline hidden></video>
  <p id="lightbox-caption"></p>
</dialog>

<script>
  const lightbox = document.getElementById('photo-lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxVideo = document.getElementById('lightbox-video');
  const lightboxCaption = document.getElementById('lightbox-caption');
  const closeBtn = document.getElementById('close-lightbox');


  document.querySelectorAll('.gallery2 img').forEach(img => {
    img.addEventListener('click', () => {
        lightboxVideo.hidden = true;
      lightboxVideo.pause();
      lightboxImg.hidden = false;
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightboxCaption.textContent = img.alt; // Displays the alt text below the photo
      lightbox.showModal();
    });
  });

  // Open video in lightbox
  document.querySelectorAll('.gallery2 video').forEach(vid => {
    vid.addEventListener('click', (e) => {
      e.preventDefault(); // Prevents inline play/pause when opening lightbox
      lightboxImg.hidden = true;
      lightboxVideo.hidden = false;
      lightboxVideo.src = vid.currentSrc || vid.src;
      lightboxCaption.textContent = vid.getAttribute('aria-label') || '';
      lightbox.showModal();
      lightboxVideo.play();
    });
  });

    function closeLightbox() {
    lightboxVideo.pause(); // Stops audio/video when modal closes
    lightbox.close();
  }

// Close when clicking the 'X' button
  closeBtn.addEventListener('click', () => {
    lightbox.close();
  });

  // Close when clicking the dark backdrop outside the image
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.close();
    }
  });
  
</script>
